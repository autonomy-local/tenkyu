# ラベルの正本。scripts/bootstrap-repo.sh が GitHub に同期する。
# 種別はコミットメッセージの接頭辞（feat: fix: ...）とそろえる。
# 範囲（area:*）はリポジトリごとに末尾へ足す。

# 種別
- name: feat
  color: "1d76db"
  description: 機能の追加
- name: fix
  color: "d73a4a"
  description: 不具合の修正
- name: docs
  color: "0075ca"
  description: 文書だけの変更
- name: chore
  color: "cfd3d7"
  description: ビルド・依存・設定など、振る舞いが変わらない作業
- name: refactor
  color: "a2eeef"
  description: 振る舞いを変えないコードの整理
- name: test
  color: "bfd4f2"
  description: テストの追加・修正

# 進み具合
- name: agent:ready
  color: "0e8a16"
  description: 終了条件が書けていて、エージェントが取ってよい
- name: agent:wip
  color: "fbca04"
  description: エージェントが作業中
- name: needs:decision
  color: "b60205"
  description: 人の判断待ち。推測で進めない
- name: blocked
  color: "000000"
  description: ほかの Issue や外部の事情で止まっている

# 出どころ
- name: spec
  color: "c5def5"
  description: Spec Kit の tasks.md から起こした Issue（scripts/spec/spec_to_issues.py）

- name: fork
  color: "d4c5f9"
  description: フォークでの変更のお知らせ（取り込むかは人が決める）

# 依存（本文の「前提となる Issue」と合わせる）
- name: deps:none
  color: "c2e0c6"
  description: 前提がそろっている。ほかの Issue と並べて着手してよい
- name: deps:waiting
  color: "d4c5f9"
  description: 前提となる Issue（または着手の条件）待ち。前提が閉じたら deps:none に付け替える

# エージェントへの割り当て
- name: jules
  color: "4285f4"
  description: Jules に渡す。付けると Jules の GitHub アプリが拾って作業を始め、PR を出す

# レビュー（scripts/review/impact.py が付け替える。手で付けるのは review:escalate だけ）
- name: review:critical
  color: "b60205"
  description: 人のレビューが必須（CODEOWNER の総括と、各ファイルへの行コメント）
- name: review:standard
  color: "fbca04"
  description: AI のレビューの承認が必須
- name: review:light
  color: "c2e0c6"
  description: レビュー不要（自動マージ）
- name: review:escalate
  color: "5319e7"
  description: 手で critical に上げる（判定より重く扱いたいとき）

# 優先度
- name: p1
  color: "e11d21"
  description: 優先度・高（今のスプリントで必ず）
- name: p2
  color: "eb6420"
  description: 優先度・中
- name: p3
  color: "f9d0c4"
  description: 優先度・低（手が空いたら）
