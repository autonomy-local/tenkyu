name: タスク
description: 1つの作業単位を Issue にする（人と AI エージェントの両方が読み、PR で終了条件を検証できる形）
title: "[タスク] "
body:
  - type: markdown
    attributes:
      value: |
        **書き方のきまり**
        - 1つの Issue は、1つの PR で終わる大きさの作業にします。親子 Issue（サブ Issue）は使いません。大きい作業は、独立した Issue に分けて「前提となる Issue」でつなぎます
        - この Issue だけを読めば作業を始められるように書きます。会話や口頭の前提に頼らず、必要な情報は本文か「参考」のリンクに置きます
        - 「終了条件」は、レビューアーが PR を見て「満たした／満たしていない」を判定できる文にします。振る舞いは EARS の型（「〜したとき、システムは〜する」）で書きます。「改善する」「整える」のような判定できない言葉は使いません

  - type: input
    id: task-id
    attributes:
      label: タスクID
      description: README の「これからの予定」などの計画にある ID。無ければ空でかまいません
      placeholder: "例：今-1 / 次-2"
    validations:
      required: false

  - type: textarea
    id: background
    attributes:
      label: 背景と目的
      description: なぜこの作業が必要か。終わると何ができるようになるか
      placeholder: |
        例：利用者がパスワードなしでログインできるように、メールの確認コード（6桁）で本人を確かめたい。
        これができると、らくらくスマートフォンや LINE の中のブラウザからでもログインできる。
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: やること
      description: 作業の中身。触ってよいファイルやディレクトリが決まっていれば書きます
      placeholder: |
        - 確認コードを発行し、D1 に有効期限つきで保存する Worker のエンドポイントを追加する
        - 変更してよい範囲：`src/`、`migrations/`、`README.md` の「何をするか」節
    validations:
      required: true

  - type: textarea
    id: done-criteria
    attributes:
      label: 終了条件
      description: |
        PR でレビューアーが1つずつ確認するチェックリストです。振る舞いは EARS の型（docs/workflow.md の「終了条件の書き方」）か Given/When/Then で書き、各項目に「何を見れば判定できるか」（コマンドとその結果、ファイルのパス、テスト名、CI のジョブ名など）を書きます。
        `- [ ] ` で始まるチェックリストで書きます。PR の作成者は、PR の本文でこの項目ごとに満たしたことの根拠を示します
      placeholder: |
        - [ ] 利用者が正しい確認コードを入力したとき、システムはセッションを発行する（`otp.test.ts` の「検証できる」）
        - [ ] 期限の切れたコードを入力した場合は、システムは検証を失敗にする（`otp.test.ts` の「期限切れ」）
        - [ ] `auth_events` に、発行と検証の記録が残る
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: やらないこと
      description: この Issue では扱わないこと。範囲を広げそうなものを先に書いておきます。別の Issue にする場合はリンクします
      placeholder: |
        - メールの送信の仕組み（#12 で扱う）
        - パスキー
    validations:
      required: true

  - type: textarea
    id: depends-on
    attributes:
      label: 前提となる Issue
      description: 先に終わっている必要がある Issue。無ければ「なし」と書きます
      placeholder: "例：#3（セッションの表）／なし"
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 参考
      description: 仕様、決定事項（ADR）、旧実装の該当箇所、関連する文書へのリンク
      placeholder: |
        - README の「誰でも使えるようにする」
    validations:
      required: false

  - type: checkboxes
    id: fix-consent
    attributes:
      label: 修正を提供する場合の同意（任意）
      description: |
        自分のフォークでの修正へのリンクをこの Issue に書く場合だけ、チェックしてください。修正がない Issue では空のままで構いません。
        修正は、このリポジトリの [LICENSE](https://github.com/autonomy-local/tenkyu/blob/main/LICENSE)（Apache License 2.0）で提供されるものとして扱います。
      options:
        - label: 修正は Apache License 2.0 で提供します
        - label: 各コミットに Signed-off-by（DCO）を付けています
    validations:
      required: false
