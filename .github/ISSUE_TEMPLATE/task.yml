name: タスク
description: 1つの作業単位を Issue にする（人と AI エージェントの両方が読み、PR で終了条件を検証できる形）
title: "[タスク] "
body:
  - type: markdown
    attributes:
      value: |
        **書き方のきまり**
        - 1つの Issue は、1つの PR で終わる大きさの作業にします。親子 Issue（サブ Issue）は使いません。大きい作業は、独立した Issue に分けて「前提となる Issue」でつなぎます
        - この Issue だけを読めば作業を始められるように書きます。会話や口頭の前提に頼らず、必要な情報は本文か「参考」のリンクに置きます
        - 「終了条件」は、レビューアーが PR を見て「満たした／満たしていない」を判定できる文にします。「改善する」「整える」のような判定できない言葉は使いません

  - type: input
    id: task-id
    attributes:
      label: タスクID
      description: docs/migration-phases.md などの計画にある ID。無ければ空でかまいません
      placeholder: "例：P0-2 / 2.1"
    validations:
      required: false

  - type: textarea
    id: background
    attributes:
      label: 背景と目的
      description: なぜこの作業が必要か。終わると何ができるようになるか
      placeholder: |
        例：フェーズ0のゴール（Bootstrap が動く）に向けて、開発に必要なツールを1つのコマンドでそろえたい。
        これができると、新しいコントリビューターと AI エージェントが同じ環境で作業を始められる。
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: やること
      description: 作業の中身。触ってよいファイルやディレクトリが決まっていれば書きます
      placeholder: |
        - `flake.nix` に開発シェルを追加する（Go、Bun、Node、wrangler、Pulumi、sqlc、psql、sops、age）
        - 変更してよい範囲：`flake.nix`、`flake.lock`、`README.md` の「開発環境」節
    validations:
      required: true

  - type: textarea
    id: done-criteria
    attributes:
      label: 終了条件
      description: |
        PR でレビューアーが1つずつ確認するチェックリストです。各項目に「何を見れば判定できるか」（コマンドとその結果、ファイルのパス、テスト名、CI のジョブ名など）を書きます。
        `- [ ] ` で始まるチェックリストで書きます。PR の作成者は、PR の本文でこの項目ごとに満たしたことの根拠を示します
      placeholder: |
        - [ ] `nix develop -c go version` が成功する
        - [ ] `nix develop` の中で `bun`、`node`、`wrangler`、`pulumi`、`sqlc`、`psql`、`sops`、`age` がすべて実行できる
        - [ ] README の「開発環境」節に `nix develop` の手順が書かれている
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: やらないこと
      description: この Issue では扱わないこと。範囲を広げそうなものを先に書いておきます。別の Issue にする場合はリンクします
      placeholder: |
        - ローカルの PostgreSQL の起動（#12 で扱う）
        - CI への組み込み
    validations:
      required: true

  - type: textarea
    id: depends-on
    attributes:
      label: 前提となる Issue
      description: 先に終わっている必要がある Issue。無ければ「なし」と書きます
      placeholder: "例：#3（レポと文書）／なし"
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 参考
      description: 仕様、決定事項（ADR）、旧実装の該当箇所、関連する文書へのリンク
      placeholder: |
        - docs/migration-phases.md の「P0-2　開発環境（Nix）」
    validations:
      required: false

  - type: checkboxes
    id: fix-consent
    attributes:
      label: 修正を提供する場合の同意（任意）
      description: |
        自分のフォークでの修正へのリンクをこの Issue に書く場合だけ、チェックしてください。修正がない Issue では空のままで構いません。
        条件は [CONTRIBUTING.md](https://github.com/autonomy-local/funadansu/blob/main/CONTRIBUTING.md) の「修正の条件」にあります。
      options:
        - label: 修正は MIT License で提供します
        - label: 各コミットに Signed-off-by（DCO）を付けています
    validations:
      required: false
