# 外からの PR を閉じ、フォークと Issue での知らせ方を案内する（CONTRIBUTING.md）。
# 主の止め方は、リポジトリの設定（Settings → General → Features → Pull requests → Collaborators only）。
# これは設定が外れたとき・効かなかったときの保険。
#
# pull_request_target で動かし、判定のスクリプトは main の側（base）を使う。
# PR の側のコードは checkout も実行もしない。
name: external-pr

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read # base 側の判定スクリプトの取得
  pull-requests: write
  issues: write

jobs:
  close:
    # 公開の関係者と、同じリポジトリの bot の PR はここで飛ばす。
    # 非公開の組織メンバーは author_association で見分けられないため、スクリプト側で権限を確かめる。
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository
      || (!contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
          && github.event.pull_request.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/review
      - name: 外からの PR なら案内して閉じる
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/review/external_pr.py --pr "$PR_NUMBER"
