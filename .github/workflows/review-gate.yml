# レビューが付いたら、review-gate を付け直す。workflow_run なので main の側の定義とスクリプトで動く。
name: review-gate

on:
  workflow_run:
    workflows: [review-events]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

# review.yml と同じグループ。PR ごとに review-gate の書き込みを直列にする。
# 待機中の実行が置き換わっても、最後の実行が最新の状態を読むので判定は残る
concurrency:
  group: review-gate-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # 既定のブランチ（main）
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml pathspec
      - name: PR の番号を探す
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          # 通知元の PR を使う。fork の PR は pull_requests が空なので、コミットから探す
          n="$RUN_PR"
          if [ -z "$n" ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" -q '[.[] | select(.state=="open")][0].number // empty')
          fi
          echo "number=$n" >> "$GITHUB_OUTPUT"
      - name: review-gate
        if: steps.pr.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: python3 scripts/review/gate.py --pr "$PR_NUMBER"
