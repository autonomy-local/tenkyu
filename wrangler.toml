name = "tenkyu"
main = "src/index.ts"
compatibility_date = "2024-04-05"
workers_dev = false
preview_urls = false

# 期限を過ぎた記録・コード・セッションを消す（src/retention/、docs/data-retention.md）。1日に1回、UTC の 18:30（日本時間の 3:30）
[triggers]
crons = ["30 18 * * *"]

# D1 の結び付け。database_id は配備先ごとの値で、Pulumi（infra/cloudflare/）で作った D1 の ID に置き換える。
# 手元とテストでは使わない（--local と vitest-pool-workers は名前だけで手元の D1 を作る）。
[[d1_databases]]
binding = "DB"
database_name = "tenkyu-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
